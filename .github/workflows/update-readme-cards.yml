
name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent multiple instances of this workflow
# from modifying the same branch simultaneously.
concurrency:
  group: update-readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================
      # CONTRIBUTION CALENDAR
      # ==========================================
      - name: Generate contribution calendar
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python3 .github/scripts/generate_contribution_calendar.py

      # ==========================================
      # STREAK CARD - DARK
      # ==========================================
      - name: Streak card (dark)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "user=${{ github.repository_owner }}&theme=react&hide_border=true&background=0D1117&stroke=21262D&ring=58A6FF&fire=58A6FF&currStreakNum=F0F6FC&sideNums=C9D1D9&currStreakLabel=8B949E&sideLabels=8B949E&dates=6E7681&border_radius=12"
          path: profile/streak-dark.svg
          token: ${{ secrets.STATS_TOKEN }}

      # ==========================================
      # STREAK CARD - LIGHT
      # ==========================================
      - name: Streak card (light)
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "user=${{ github.repository_owner }}&theme=default&hide_border=true&border_radius=12&ring=0969DA&fire=0969DA&currStreakLabel=57606A"
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN }}

      # ==========================================
      # TOP LANGUAGES - DARK
      # ==========================================
      - name: Languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=react&hide_border=true&hide_title=true&langs_count=20&bg_color=0d1117&text_color=c9d1d9&border_radius=12&card_width=495"
          path: profile/top-langs-dark.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      # ==========================================
      # TOP LANGUAGES - LIGHT
      # ==========================================
      - name: Languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=default&hide_border=true&hide_title=true&langs_count=20&border_radius=12&card_width=495"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      # ==========================================
      # COMMIT AND PUSH GENERATED CARDS
      # ==========================================
      - name: Commit and push cards
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage generated files only
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "Update README cards"

          # Synchronize with remote and retry if another
          # process pushes while this workflow is running.
          for attempt in 1 2 3 4 5; do

            echo "--------------------------------"
            echo "Push attempt: $attempt"
            echo "--------------------------------"

            git fetch origin "$BRANCH_NAME"

            # Rebase our generated cards onto the latest
            # remote branch. Prefer newly generated SVGs
            # if the same SVG was modified remotely.
            git rebase -X theirs "origin/$BRANCH_NAME"

            if git push origin "HEAD:$BRANCH_NAME"; then
              echo "Successfully updated README cards."
              exit 0
            fi

            echo "Push rejected. Synchronizing again..."
            sleep 3

          done

          echo "ERROR: Unable to push after 5 attempts."
          exit 1
